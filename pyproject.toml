    "dotmap>=1.3.30",
    "etils>=1.12.2",
    "farama-notifications>=0.0.4",
    "flask>=3.1.1",
    "flask-cors>=6.0.1",
    "fonttools>=4.58.4",
    "fsspec>=2025.5.1",
