defaults:
  - network: ff_nps
  - _self_

ENV_NAME: scratchitch
ENV_KWARGS:
  ctrl_cost_weight: 0
  homogenisation_method: max
  backend: mjx
  het_reward: False
  disability:
    joint_idx: 13
    joint_restriction_factor: 1.0
    joint_strength: 1.0
    tremor_magnitude: 0.0
TOTAL_TIMESTEPS: 4e7
NUM_STEPS: 64 
NUM_ENVS: 1024
NUM_SEEDS: 12 
SEED: 12 
NUM_EVAL_EPISODES: 64 

# RL HYPERPARAMETERS
ALGORITHM: PPO
PARTNER_ALGORITHMS: ["IPPO"]
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 4
ANNEAL_LR: False
LR: 1e-3
ENT_COEF: 1e-4
CLIP_EPS:  0.3
SCALE_CLIP_EPS: False
RATIO_CLIP_EPS: False
GAMMA: 0.99
GAE_LAMBDA: 0.95
VF_COEF: 1.0
MAX_GRAD_NORM: 0.5
ADAM_EPS: 1e-8
SPLIT_RATIO: 0.2 # The train/test split ratio e.g. 0.2 means 20% train, 80% test

# COMPUTE OPTIONS
GPU_ENV_CAPACITY: 8192
ADVANTAGE_UNROLL_DEPTH: 8
DISABLE_JIT: False
DEVICE: 0
PRINT_MEMORY_STATS: True

# ZOO SETTINGS
ZOO_PATH: /home/leo/assistive-autonomy-github/assistax/zoo

# Visualization settings
SAVE_MUJOCO_TRAJECTORIES: True
SAVE_HTML_RENDER: True
RENDER_VIDEOS: False
VIDEO_FPS: 30
VIDEO_WIDTH: 1920
VIDEO_HEIGHT: 1080
VIDEO_QUALITY: "high"
EXP_ID: ${oc.env:EXP_ID,${now:%Y-%m-%d_%H-%M-%S}}

# WandB Params
ALG: PPO_AHT
ENTITY: "lh-from-kb"
PROJECT: "assistax-dev"
WANDB_MODE: "online"
EXP_TAGS: ["ZSC","PPO","AHT"]

hydra:
  job:
    chdir: true
  run:
    dir: outputs/ZSC/${ENV_NAME}/${ALGORITHM}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/ZSC/${ENV_NAME}/${ALGORITHM}/${now:%Y-%m-%d}/${now:%H-%M-%S}
