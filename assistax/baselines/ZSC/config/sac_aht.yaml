defaults:
  - network: ff_nps
  - _self_

ENV_NAME: scratchitch
ENV_KWARGS:
  ctrl_cost_weight: 0
  homogenisation_method: max
  backend: mjx
  het_reward: False
  disability:
    joint_idx: 13
    joint_restriction_factor: 1.0
    joint_strength: 1.0
    tremor_magnitude: 0.0
TOTAL_TIMESTEPS: 6e6

# NUM_STEPS: 256
NUM_ENVS: 6
NUM_SEEDS: 6
SEED: 0
NUM_EVAL_EPISODES: 32 # lower for rendering
NUM_CHECKPOINTS: 256 # how often to save the training parameters for evaluating later

TEST_DURING_TRAINING: True # not currently in use for SAC

# RL HYPERPARAMETERS
ALGORITHM: SAC
EXPLORE_STEPS: 5000
PARTNER_ALGORITHMS: ["IPPO", "MAPPO"]  # number of steps to take with random actions at the start of training
POLICY_UPDATE_DELAY: 4  # Every `policy_update_delay` q network learning steps the policy network is trained.
                        # It is trained `policy_update_delay` times to compensate, this is a TD3 trick.

# sizes
BUFFER_SIZE: 1000000  # size of the replay buffer. Note: total size is this * num_devices
BATCH_SIZE: 128

# learning rates
POLICY_LR: 3e-4  # the learning rate of the policy network optimizer
Q_LR: 1e-3  # the learning rate of the Q network network optimizer
ALPHA_LR: 3e-4  # the learning rate of the alpha optimizer
MAX_GRAD_NORM: 10

# SAC specific
TAU: 0.005  # smoothing coefficient for target networks
GAMMA: 0.99  # discount factor
NUM_SAC_UPDATES: 32 # Epochs over data
ROLLOUT_LENGTH: 8 # number of environment steps per vectorised environment.

AUTOTUNE: True  # whether to autotune alpha
TARGET_ENTROPY_SCALE: 5.0  # scale factor for target entropy (when auto-tuning)
INIT_ALPHA: 0.1  # initial entropy value when not using autotune

SPLIT_RATIO: 0.2 # The train/test split ratio e.g. 0.2 means 20% train, 80% test

# When present and not null, replaces SPLIT_RATIO with extreme-based selection.
# When absent/commented out, the existing random SPLIT_RATIO split is used.
EXTREME_SPLIT:
  num_extreme: 10          # Number of extreme agents to select (total)
  role: "train"             # Where extreme agents go: "test" or "train"
  mode: "single"           # Selection mode: "single", "multi", or "composite"

  # --- mode: "single" ---
  # Select top/bottom agents along ONE preference dimension
  column: "w_speed"        # Which preference column to rank by
  end: "max"              # "min", "max", or "both" (default). "both" selects num_extreme/2 from each end

  # --- mode: "multi" ---
  # Select top/bottom agents along MULTIPLE dimensions independently.
  # Total extreme agents = num_extreme * len(columns) (deduplicated).
  columns:
    - column: "w_force"
      end: "both"
    - column: "w_speed"
      end: "max"

  #--- mode: "composite" ---
  #Rank agents by Euclidean distance from centroid across preference dimensions.
  #Selects the num_extreme most "extreme" agents overall.
  dimensions: ["w_speed", "w_force", "w_touch"]  # optional, defaults to all 3

# COMPUTE OPTIONS
GPU_ENV_CAPACITY: 8192
DISABLE_JIT: False
DEVICE: 0

DETERMINISTIC_EVAL: False

# ZOO SETTINGS
ZOO_PATH: /home/lhin/assistax/zoo 


# Visualization settings
SAVE_MUJOCO_TRAJECTORIES: True
SAVE_HTML_RENDER: True
RENDER_VIDEOS: False
VIDEO_FPS: 30
VIDEO_WIDTH: 1920
VIDEO_HEIGHT: 1080
VIDEO_QUALITY: "high"
EXP_ID: ${oc.env:EXP_ID,${now:%Y-%m-%d_%H-%M-%S}}

# WandB Params
ALG: SAC_AHT
ENTITY: "lh-from-kb"
PROJECT: "assistax-dev"
WANDB_MODE: "online"
EXP_TAGS: ["ZSC","SAC","AHT"]

hydra:
  job:
    chdir: true
  run:
    dir: outputs/zsc/${ENV_NAME}/${ALGORITHM}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/zsc/${ENV_NAME}/${ALGORITHM}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ""
