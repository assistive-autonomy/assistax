defaults:
  - network: ff_nps
  - _self_

ENV_NAME: scratchitch 
ALG: MAPPO
ENV_KWARGS:
  ctrl_cost_weight: 0
  homogenisation_method: max
  backend: mjx
  het_reward: False # needs to be true for pushcoop
  episode_length: 1000
  #disability:
  #  joint_idx: 13
  #  joint_restriction_factor: 1.0
  #  joint_strength: 1.0
  #  tremor_magnitude: 0.0
TOTAL_TIMESTEPS: 30e6
NUM_STEPS: 256
NUM_ENVS: 512
NUM_SEEDS: 4
SEED: 0
NUM_EVAL_EPISODES: 1

# RL HYPERPARAMETERS
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 4
ANNEAL_LR: False
LR: 2.5e-4
ENT_COEF: 1e-4
CLIP_EPS: 0.2
SCALE_CLIP_EPS: False
RATIO_CLIP_EPS: False
GAMMA: 0.99
GAE_LAMBDA: 0.95
VF_COEF: 1.0
MAX_GRAD_NORM: 0.5
ADAM_EPS: 1e-8

# COMPUTE OPTIONS
GPU_ENV_CAPACITY: 8192
ADVANTAGE_UNROLL_DEPTH: 8
DISABLE_JIT: False
DEVICE: 0
PRINT_MEMORY_STATS: True

# EVAL SETTINGS
eval:
  compute_value: false
  path: 
    human: ./path/to/human.safetensors
    robot: ./path/to/robot.safetensors


# SWEEPER SETTINGS
sweep:
  num_configs: 4
  lr:
    min: -4.0
    max: -3.0
  ent_coef: false
  clip_eps: false

# Visualization settings
SAVE_MUJOCO_TRAJECTORIES: True  # Always save trajectories (minimal overhead)
SAVE_HTML_RENDER: False 
RENDER_VIDEOS: True  # Set to True for important runs
VIDEO_FPS: 30  # Frames per second for videos
VIDEO_WIDTH: 1920 # Video width in pixels
VIDEO_HEIGHT: 1080  # Video height in pixels
VIDEO_QUALITY: "high"  # "low", "medium", or "high"
EXP_ID: ${oc.env:EXP_ID,${now:%Y-%m-%d_%H-%M-%S}} 

# WandB Params
ENTITY: "lh-from-kb" 
PROJECT: "assistax-dev"
WANDB_MODE: "online" # "disabled" or "online"
EXP_TAGS: ["MAPPO","FF","NoPS","Vectorized", "NoPref"]

