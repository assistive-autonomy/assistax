defaults:
  - network: ff_nps
  - _self_

ENV_NAME: scratchitch 
ALG: IPPO
ENV_KWARGS:
  ctrl_cost_weight: 0
  homogenisation_method: max
  backend: mjx
  het_reward: False # Has to be true for pushcoop otherwise false
  # episode_length: 1000
  disability:
    joint_idx: 13
    joint_restriction_factor: 1.0
    joint_strength: 1.0
    tremor_magnitude: 0.0
  sparse_rewards: 
    mode: periodic
    period: 100 
    accumulate: True
  # preference_rewards:
  #   preference_weights:
  #     speed_preference: 0.25:
  #     force_preference: 0.35
  #     action_efficiency: 0.15
  #     touch_penalty: -0.03
  #   preference_ranges:
  #     speed_range: [0.06, 0.14]
  #     force_range: [1.5, 3.5]
  #     max_action_magnitude: 0.8
  #   touch_threshold: 0.3
  #   variable_names:
  #     speed: "scratcher_speed"
  #     force: "scratcher_force"
  #     action_magnitude: "action_magnitude"
  #     contact_forces: "contact_forces"  

  # pixel_obs:
  #   hw: 64
  #   frame_stack: 3
  #   return_float32: False
  #   cache_objects: False
  #   n_envs: 2  # if cachinig same as NUM_ENVS

TOTAL_TIMESTEPS: 1e8
NUM_STEPS: 64
NUM_ENVS: 1024 
NUM_SEEDS: 1 
SEED: 0
NUM_EVAL_EPISODES: 8 


# RL HYPERPARAMETERS
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 4
ANNEAL_LR: False
LR: 0.0010507666738703847
ENT_COEF: 1e-4
CLIP_EPS:  0.2
SCALE_CLIP_EPS: False
RATIO_CLIP_EPS: False
GAMMA: 0.99
GAE_LAMBDA: 0.95
VF_COEF: 1.0
MAX_GRAD_NORM: 0.5
ADAM_EPS: 1e-8

# COMPUTE OPTIONS
GPU_ENV_CAPACITY: 8192
ADVANTAGE_UNROLL_DEPTH: 8
DISABLE_JIT: False
DEVICE: 0

# EVAL TRAIN STATE
eval:
  path:
    human: ./path/to/human.safetensors
    robot: ./path/to/robot.safetensors
    all: ./path/to/all.safetensors
# SWEEPER SETTINGS
sweep:
  num_configs: 4
  lr:
    min: -4.0
    max: -3.0
  ent_coef: false
  clip_eps: false

hydra:
  job:
    chdir: true
  run:
    dir: outputs/${ENV_NAME}/${ALG}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${ENV_NAME}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: seed_${SEED}_reward_period_${ENV_KWARGS.sparse_rewards.period}