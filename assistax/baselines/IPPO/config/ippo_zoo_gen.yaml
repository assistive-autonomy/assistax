defaults:
  - network: ff_nps
  - _self_

ENV_NAME: scratchitch
ENV_KWARGS:
  ctrl_cost_weight: 0
  homogenisation_method: max
  backend: mjx
  het_reward: False
  disability:
    joint_idx: 13
    joint_restriction_factor: 1.0
    joint_strength: 1.0
    tremor_magnitude: 0.0
  preference_rewards:
    preference_weights:
      speed_preference: 0.25
      force_preference: 0.35
      action_efficiency: 0.15
      touch_penalty: -0.03
    preference_ranges:
      speed_range: [0.06, 0.14]
      force_range: [1.5, 3.5]
      max_action_magnitude: 0.8
    touch_threshold: 0.3
    variable_names:
      speed: "ee_speed"
      force: "ee_force"
      action_magnitude: "action_magnitude"
    overall_weight: 1
    reward_budget: 1.5

TOTAL_TIMESTEPS: 4e7 
NUM_STEPS: 256
NUM_ENVS: 1024
NUM_SEEDS: 1  
SEED: 0
NUM_EVAL_EPISODES: 5 
# RL HYPERPARAMETERS
ALGORITHM: IPPO
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 4
ANNEAL_LR: False
LR: 1e-3
ENT_COEF: 1e-4
CLIP_EPS:  0.3
SCALE_CLIP_EPS: False
RATIO_CLIP_EPS: False
GAMMA: 0.99
GAE_LAMBDA: 0.95
VF_COEF: 1.0
MAX_GRAD_NORM: 0.5
ADAM_EPS: 1e-8

# COMPUTE OPTIONS
GPU_ENV_CAPACITY: 8192
ADVANTAGE_UNROLL_DEPTH: 8
DISABLE_JIT: False
DEVICE: 0
PRINT_MEMORY_STATS: True

# ZOO SETTINGS
ZOO_PATH: /home/leo/assistive-autonomy-github/assistax/zoo

# Preference sweep for diverse zoo generation
# Remove/comment out to disable preference vmapping
PREFERENCE_SWEEP:
  num_configs: 4  # number of unique preference combinations to sample
  # Meta-ranges for preference weights (uniform sampling)
  w_speed:
    min: 0.1
    max: 0.5
  w_force:
    min: 0.1
    max: 0.6
  w_action:
    min: 0.05
    max: 0.3
  w_touch:  # negative range for penalty
    min: -0.1
    max: -0.01
  # Meta-ranges for preference ranges
  speed_range_min:
    min: 0.03
    max: 0.08
  speed_range_max:
    min: 0.10
    max: 0.20
  force_range_min:
    min: 1.0
    max: 2.0
  force_range_max:
    min: 3.0
    max: 5.0
  max_action_magnitude:
    min: 0.5
    max: 1.0

hydra:
  job:
    chdir: true
  run:
    dir: outputs/mabrax/${ENV_NAME}/${ALGORITHM}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/mabrax/${ENV_NAME}/${ALGORITHM}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: prefrew_s${ENV_KWARGS.preference_rewards.preference_weights.speed_preference}_f${ENV_KWARGS.preference_rewards.preference_weights.force_preference}_a${ENV_KWARGS.preference_rewards.preference_weights.action_efficiency}_t${ENV_KWARGS.preference_rewards.preference_weights.touch_penalty}