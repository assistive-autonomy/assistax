defaults:
  - network: ff_nps
  - _self_

    #ENV_NAME: scratchitch
ENV_NAME: scratchitch
ALG: IPPO
ENV_KWARGS:
  ctrl_cost_weight: 0
  homogenisation_method: max
  backend: mjx
  het_reward: False  # Has to be true for pushcoop otherwise false
    #disability:
    #  joint_idx: 13
    #  joint_restriction_factor: 1.0
    #  joint_strength: 1.0
    #  tremor_magnitude: 0.0
TOTAL_TIMESTEPS: 4e7
NUM_STEPS: 64
NUM_ENVS: 1024 
NUM_SEEDS: 4
SEED: 0
NUM_EVAL_EPISODES: 16   

# RL HYPERPARAMETERS
UPDATE_EPOCHS: 4
NUM_MINIBATCHES: 4
ANNEAL_LR: False
LR: 2.5e-4
ENT_COEF: 1e-4
CLIP_EPS: 0.2
SCALE_CLIP_EPS: False
RATIO_CLIP_EPS: False
GAMMA: 0.99
GAE_LAMBDA: 0.95
VF_COEF: 1.0
MAX_GRAD_NORM: 0.5
ADAM_EPS: 1e-8

# COMPUTE OPTIONS
GPU_ENV_CAPACITY: 8192
ADVANTAGE_UNROLL_DEPTH: 8
DISABLE_JIT: False
DEVICE: 0

# SWEEPER SETTINGS
SWEEP:
  num_configs: 2
  lr:
    min: -4.0
    max: -2.0
  ent_coef:
    min: -5.0
    max: -2.0
  clip_eps:
    min: -2.0
    max: -0.5 

# Saving Options
SAVE_ALL_TRAIN_STATES: false
SAVE_FINAL_TRAIN_STATE: false

ENTITY: "lh-from-kb" 
PROJECT: "assistax-dev"
WANDB_MODE: "online" # "disabled" or "online"
EXP_TAGS: ["SWEEP", "IPPO","FF","NoPS","Vectorized", "NoPref"]
EXP_ID: ${oc.env:EXP_ID,${now:%Y-%m-%d_%H-%M-%S}}   # Unique experiment identifier based on timestamp

hydra:
  job:
    chdir: true
  run:
    dir: outputs/${ENV_NAME}/${ALG}/{now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${ENV_NAME}/${ALG}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ""
